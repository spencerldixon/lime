[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lime-markdown"
version = "0.1.0"
description = "Markdown for Ghostty: big headings, real text, native scroll and search."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "markdown-it-py>=3,<5",
  "Pillow>=11,<13",
  "rich>=14,<15",
  "ruamel-yaml>=0.19,<0.20",
]

[project.scripts]
lime = "lime.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/lime"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
